name: Testing
description: Fully universal | Used for testing with run_test.sh script placed in repo root

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/**'
      
jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Running tests
        run: |
          chmod +x ./run_test.sh  
          ./run_test.sh