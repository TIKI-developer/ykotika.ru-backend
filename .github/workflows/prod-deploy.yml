name: Production Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_IP: ${{ vars.SERVER_IP }} 

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Clean up Docker on server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@$SERVER_IP << 'EOF'
            # Очистка неиспользуемых образов, контейнеров и кэша сборки
            sudo docker system prune -af
            sudo docker volume prune -f
          EOF

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@$SERVER_IP << 'EOF'
            cd /var/www/ykotika/ykotika.ru-backend/ || exit
            sudo git fetch --all
            sudo git pull origin main
            sudo docker-compose down api
            sudo docker-compose up -d --build api
          EOF
